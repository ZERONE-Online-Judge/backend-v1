name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "migrations/**"
      - "deploy/**"
      - "playground/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "alembic.ini"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    paths:
      - "app/**"
      - "migrations/**"
      - "deploy/**"
      - "playground/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "alembic.ini"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: sqlite:////tmp/zerone_online_judge_ci.db
      ENABLE_DEMO_SEED: "true"
      ALLOW_EMPTY_OTP: "true"
      LOCAL_OBJECT_STORAGE_ROOT: /tmp/zerone_online_judge_objects
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

  playground-test:
    name: Playground Isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gVisor in the disposable CI runner
        run: |
          mkdir -p /tmp/zoj-gvisor-install
          cd /tmp/zoj-gvisor-install
          base="https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)"
          curl -fsSL "$base/gvisor.tar.bz2" -o gvisor.tar.bz2
          curl -fsSL "$base/gvisor.tar.bz2.sha512" -o gvisor.tar.bz2.sha512
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
      - name: Verify real code execution and isolation
        run: |
          python -m pip install httpx==0.28.1
          docker build -f playground/Dockerfile.runner -t zoj-verification-playground:1 playground
          python playground/smoke_check.py

  deploy:
    name: Deploy Backend
    needs: [test, playground-test]
    runs-on: [self-hosted, zoj-prod, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy on server
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          cd ~/zerone-online-judge/backend-v1
          git fetch origin main
          git checkout main
          git pull origin main
          RELEASE_VERSION="$RELEASE_VERSION" ./deploy/deploy-main-bluegreen.sh
          curl -f http://127.0.0.1:6001/api/health
