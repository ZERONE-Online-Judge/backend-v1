include /etc/nginx/shared/api-upstream.conf;

server {
    listen 443 ssl;
    server_name 10.10.10.110;
    ssl_certificate /etc/nginx/judge-tls/server.crt;
    ssl_certificate_key /etc/nginx/judge-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/shared/judge-access.inc;

    location = /api/health {
        proxy_pass http://api_backend;
    }
    location /minio/ {
        allow 10.10.10.111;
        allow 10.10.10.112;
        allow 10.10.10.113;
        allow 10.10.10.114;
        allow 10.10.10.115;
        allow 10.10.10.116;
        allow 10.10.10.117;
        deny all;
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location / { return 404; }
}
