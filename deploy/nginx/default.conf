server {
  listen 80;
  server_name zoj.kr _;
  client_max_body_size 512m;
  limit_req_status 429;
  limit_req_log_level notice;
  error_page 429 = @capacity_busy;

  location @capacity_busy {
    default_type application/json;
    add_header Retry-After "1" always;
    add_header Cache-Control "no-store" always;
    add_header X-Request-ID $request_id always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Access-Control-Allow-Origin $capacity_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
    return 429 '{"error":{"code":"api_busy","message":"요청이 많습니다. 잠시 후 다시 시도해 주세요.","request_id":"$request_id","details":{"retry_after_seconds":1}}}';
  }

  root /usr/share/nginx/html;
  index index.html;

  # Judge credentials are accepted only by the private TLS gateway on 6443.
  location ^~ /api/internal/judge/ { return 403; }

  # Large private problem archives are validated before the response starts.
  location ~ ^/api/operator/contests/[^/]+/(problem-archives:(inspect|import)|problems/[^/]+/archive)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/contests/[^/]+/problems/[^/]+/(submissions|mock-submissions)$ {
    limit_req zone=web_api burst=100 nodelay;
    client_max_body_size 4m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=web_api burst=100 nodelay;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 1;
    gzip_types application/json;
    gzip_vary on;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Preserve SSE buffering control for the outer TLS proxy as well.
    proxy_pass_header X-Accel-Buffering;
    proxy_pass http://api_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio/ {
    proxy_pass http://minio:9000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio-console/ {
    proxy_pass http://minio:9001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /robots.txt {
    proxy_pass http://api_backend/api/robots.txt;
    proxy_set_header Host $host;
  }

  location = /sitemap.xml {
    proxy_pass http://api_backend/api/sitemap.xml;
    proxy_set_header Host $host;
  }

  location = /index.html {
    return 308 /$is_args$args;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = / {
    rewrite ^ /api/public/seo/document? break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-ZOJ-Page-Path $request_uri;
  }

  location / {
    try_files $uri @public_document;
  }

  location @public_document {
    rewrite ^ /api/public/seo/document? break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-ZOJ-Page-Path $request_uri;
  }
}

server {
  listen 80;
  server_name test.judge.zerone01.kr;
  client_max_body_size 512m;
  add_header X-Robots-Tag "noindex, nofollow" always;

  root /usr/share/nginx/html-test;
  index index.html;

  location ^~ /api/internal/judge/ { return 403; }

  # Large private problem archives are validated before the response starts.
  location ~ ^/api/operator/contests/[^/]+/(problem-archives:(inspect|import)|problems/[^/]+/archive)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass_header X-Accel-Buffering;
    proxy_pass http://api_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio/ {
    proxy_pass http://minio:9000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio-console/ {
    proxy_pass http://minio:9001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri /index.html;
  }
}

# TLS is terminated by the outer proxy. Keep certificates for both aliases.
# All judge agents must use zoj.kr or a private API endpoint before deployment.
server {
  listen 80;
  server_name judge.zerone01.kr www.zoj.kr;
  return 308 https://zoj.kr$request_uri;
}
