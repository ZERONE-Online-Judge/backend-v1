server {
  listen 80;
  server_name zoj.kr _;
  client_max_body_size 512m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://api_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio/ {
    proxy_pass http://minio:9000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio-console/ {
    proxy_pass http://minio:9001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /robots.txt {
    proxy_pass http://api_backend/api/robots.txt;
    proxy_set_header Host $host;
  }

  location = /sitemap.xml {
    proxy_pass http://api_backend/api/sitemap.xml;
    proxy_set_header Host $host;
  }

  location = /index.html {
    return 308 /$is_args$args;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = / {
    rewrite ^ /api/public/seo/document? break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-ZOJ-Page-Path $request_uri;
  }

  location / {
    try_files $uri @public_document;
  }

  location @public_document {
    rewrite ^ /api/public/seo/document? break;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-ZOJ-Page-Path $request_uri;
  }
}

server {
  listen 80;
  server_name test.judge.zerone01.kr;
  client_max_body_size 512m;
  add_header X-Robots-Tag "noindex, nofollow" always;

  root /usr/share/nginx/html-test;
  index index.html;

  location /api/ {
    proxy_pass http://api_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio/ {
    proxy_pass http://minio:9000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /minio-console/ {
    proxy_pass http://minio:9001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri /index.html;
  }
}

# TLS is terminated by the outer proxy. Keep certificates for both aliases.
# All judge agents must use zoj.kr or a private API endpoint before deployment.
server {
  listen 80;
  server_name judge.zerone01.kr www.zoj.kr;
  return 308 https://zoj.kr$request_uri;
}
