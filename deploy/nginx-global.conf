user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
}

http {
    # One shared service budget, not one quota per school/NAT address.
    map $uri $web_api_key {
        default $hostname;
        /api/health "";
    }
    limit_req_zone $web_api_key zone=web_api:1m rate=200r/s;
    map $http_origin $capacity_cors_origin {
        default "";
        "https://zoj.kr" $http_origin;
        "https://editor.zoj.kr" $http_origin;
        "https://test.judge.zerone01.kr" $http_origin;
        ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$ $http_origin;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 30s;
    include /etc/nginx/conf.d/*.conf;
}
